<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENPROM Sicherheitsdatenblätter</title>
<style>
        :root {
            --primary: #0078d4;
            --danger: #d13438;
            --success: #107c10;
            --bg: #f3f2f1;
            --text: #323130;
            --muted: #605e5c;
            --line: #edebe9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .update-info {
            width: 100%;
            max-width: 550px;
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 13px;
        }

        .update-value {
            color: var(--text);
            font-weight: 700;
        }

        .acknowledgement-link {
            width: 100%;
            max-width: 550px;
            min-height: 80px;
            margin-bottom: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            border: 1px solid #0d620d;
            border-radius: 12px;
            background: var(--success);
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .acknowledgement-icon {
            font-size: 24px;
            line-height: 1;
        }

        .app-container {
            width: 100%;
            max-width: 550px;
            padding: 15px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .emergency-btn,
        .download-all-btn {
            width: 100%;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            text-align: center;
        }

        .emergency-btn {
            margin-bottom: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a4262c;
            background: var(--danger);
            font-size: 18px;
            text-decoration: none;
        }

        .download-all-btn {
            margin-bottom: 15px;
            padding: 14px;
            border: 0;
            background: #005a9e;
            cursor: pointer;
            font-size: 14px;
        }

        .search-box {
            width: 100%;
            margin-bottom: 15px;
            padding: 15px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .category-item {
            margin-bottom: 8px;
        }

        .category-header {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #faf9f8;
            cursor: pointer;
            font-weight: 700;
        }

        .category-header.active {
            background: #f3f2f1;
        }

        .arrow {
            flex: 0 0 auto;
            color: var(--muted);
            transition: transform 0.3s;
        }

        .category-header.active .arrow {
            transform: rotate(180deg);
        }

        .submenu {
            display: none;
            margin: 0 0 0 5px;
            padding: 0;
            border-left: 2px solid var(--primary);
            list-style: none;
        }

        .category-header.active + .submenu {
            display: block;
        }

        .file-item {
            padding: 12px;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #f3f2f1;
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s;
        }

        .file-item:hover,
        .file-item:focus {
            background: #f9f9f9;
        }

        .file-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .file-main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .sharepoint-btn {
            padding: 6px 10px;
            background: #0078d4;
            color: #fff;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .sharepoint-btn:hover {
            background: #106ebe;
        }

        .pdf-tag {
            width: fit-content;
            margin-bottom: 3px;
            padding: 2px 4px;
            border-radius: 3px;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
        }

        .product-name {
            overflow-wrap: anywhere;
            font-size: 14px;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        .footer {
            margin-top: 25px;
            padding: 10px;
            border-top: 1px solid #eee;
            color: #a19f9d;
            text-align: center;
            font-size: 11px;
        }
</style>
</head>
<body>
<div class="update-info">
<span>Letzte Aktualisierung der Datenbank:</span>
<span class="update-value">07.07.2026</span>
</div>

    <a class="acknowledgement-link" href="#" aria-label="Kenntnisnahme der Sicherheitsdatenblätter">
<span class="acknowledgement-icon" aria-hidden="true">✓</span>
<span>KENNTNISNAHME DER SICHERHEITSDATENBLÄTTER</span>
</a>

    <main class="app-container">
<a href="tel:112" class="emergency-btn">NOTRUF: 112</a>

        <button id="downloadBtn" class="download-all-btn">ALLE KARTEN HERUNTERLADEN (OFFLINE)</button>

        <input type="text" id="search" class="search-box" placeholder="Produkt oder Dateiname suchen...">

        <div class="tree-container">
<section class="category-item">
<div class="category-header active" onclick="toggle(this)">
<span>SICHERHEITSDATENBLÄTTER GMBH (1)</span>
<span class="arrow">▼</span>
</div>
<ul class="submenu">
<li>
    <div class="file-item">
        <div class="file-row">
            <div class="file-main-content">
                <span class="pdf-tag">PDF</span>
                <a href="https://enprom365.sharepoint.com/:b:/s/M365_Ochronarodowiska/IQAXg7j82AuqS7mt6jvzCV4HAR-0HfOANDhpJpi69juRv40?e=dC6QqL" target="_blank" rel="noopener" class="product-name" style="text-decoration: none; color: inherit;">SDS_Trockengleit spray_PTFE 300_ml_Würth_DE.pdf</a>
            </div>
            <a href="https://enprom365.sharepoint.com/:b:/s/M365_Ochronarodowiska/IQAVf6WvpVLeTbySXnW2eUjQAeGH0-HEIchHr-MxmF1rszM?e=0dBatc" class="sharepoint-btn" target="_blank" rel="noopener">Kartenbeschreibung</a>
        </div>
    </div>
</li>
</ul>
</section>
</div>

        <div class="footer">ENPROM HSEQ</div>
</main>

    <script>
        function toggle(el) {
            el.classList.toggle("active");
        }

        document.getElementById("search").addEventListener("input", function (event) {
            const filter = event.target.value.toLowerCase();
            const categories = document.querySelectorAll(".category-item");

            categories.forEach((category) => {
                const items = category.querySelectorAll(".file-item");
                let hasMatch = false;

                items.forEach((item) => {
                    const text = item.textContent.toLowerCase();
                    const isMatch = text.includes(filter);
                    item.classList.toggle("hidden", !isMatch);
                    hasMatch = hasMatch || isMatch;
                });

                const header = category.querySelector(".category-header");
                if (filter.length > 0) {
                    category.classList.toggle("hidden", !hasMatch);
                    header.classList.toggle("active", hasMatch);
                } else {
                    category.classList.remove("hidden");
                    header.classList.add("active");
                }
            });
        });

        document.getElementById("downloadBtn").addEventListener("click", function () {
            const links = document.querySelectorAll(".file-main-content a.product-name");
            const confirmed = confirm("Alle Sicherheitsdatenblätter offline herunterladen? Dies kann einen Moment dauern.");

            if (!confirmed) {
                return;
            }

            links.forEach((link, index) => {
                setTimeout(() => {
                    const anchor = document.createElement("a");
                    anchor.href = link.href;
                    anchor.setAttribute("download", "");
                    document.body.appendChild(anchor);
                    anchor.click();
                    document.body.removeChild(anchor);
                }, index * 1200);
            });
        });
    </script>
</body>
</html>
